<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Французский язык — урок 7</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7fb;color:#172033}.box{padding:28px;border:1px solid #d9dfeb;border-radius:18px;background:#fff;box-shadow:0 14px 40px rgba(28,39,65,.08);max-width:560px;text-align:center}.spin{width:34px;height:34px;border:4px solid #dbe4ff;border-top-color:#3156d3;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#b42318;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="box" id="status"><div class="spin"></div><strong>Загружаю интерактивный урок…</strong></div>
  <script>
  (async()=>{
    try{
      const files=['data/part1.txt','data/part2.txt','data/part3.txt','data/part4.txt'];
      const parts=await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error('Не удалось загрузить '+f);return (await r.text()).trim()}));
      const bin=atob(parts.join(''));
      const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
      if(!('DecompressionStream' in window)) throw new Error('Этот браузер не поддерживает распаковку урока. Откройте страницу в актуальной версии Chrome, Edge, Firefox или Safari.');
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      document.open();document.write(html);document.close();
    }catch(e){document.getElementById('status').innerHTML='<strong>Не удалось открыть урок</strong><div class="err">'+String(e.message||e)+'</div>'}
  })();
  </script>
</body>
</html>
